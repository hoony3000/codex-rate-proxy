name: Build static Linux binary

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-musl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Test
        run: cargo test --all-targets

      - name: Build static binary
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify and package
        run: |
          mkdir -p package
          cp target/x86_64-unknown-linux-musl/release/codex-rate-proxy package/
          cp llm_rate_proxy.ini.example package/
          cp README.md package/
          file package/codex-rate-proxy
          if readelf -l package/codex-rate-proxy | grep -q 'Requesting program interpreter'; then
            echo 'Binary is dynamically linked; expected a static musl binary.' >&2
            exit 1
          fi
          tar -C package -czf codex-rate-proxy-x86_64-linux-musl.tar.gz .
          sha256sum codex-rate-proxy-x86_64-linux-musl.tar.gz > codex-rate-proxy-x86_64-linux-musl.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-rate-proxy-x86_64-linux-musl
          path: |
            codex-rate-proxy-x86_64-linux-musl.tar.gz
            codex-rate-proxy-x86_64-linux-musl.tar.gz.sha256
            Cargo.lock


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-musl
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-rate-proxy-x86_64-linux-musl

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            codex-rate-proxy-x86_64-linux-musl.tar.gz \
            codex-rate-proxy-x86_64-linux-musl.tar.gz.sha256 \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
