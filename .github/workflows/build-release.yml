name: Build static Linux binary

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload the binary to (for example, v0.1.0)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-musl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install musl build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build static binary
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Test launcher and lifecycle against static binary
        run: python3 tests/integration.py target/x86_64-unknown-linux-musl/release/codex-rate-proxy

      - name: Verify and package
        run: |
          mkdir -p package
          cp target/x86_64-unknown-linux-musl/release/codex-rate-proxy package/
          cp llm_rate_proxy.ini.example package/config.ini
          cp install.sh package/
          cp README.md package/
          chmod 755 package/install.sh
          test -f package/config.ini
          test -x package/install.sh
          file package/codex-rate-proxy
          if readelf -l package/codex-rate-proxy | grep -q 'Requesting program interpreter'; then
            echo 'Binary is dynamically linked; expected a static musl binary.' >&2
            exit 1
          fi
          tar -C package -czf codex-rate-proxy-x86_64-linux-musl.tar.gz .
          sha256sum codex-rate-proxy-x86_64-linux-musl.tar.gz > codex-rate-proxy-x86_64-linux-musl.tar.gz.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-rate-proxy-x86_64-linux-musl
          path: |
            codex-rate-proxy-x86_64-linux-musl.tar.gz
            codex-rate-proxy-x86_64-linux-musl.tar.gz.sha256
            Cargo.lock


  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build-musl
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: codex-rate-proxy-x86_64-linux-musl

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --generate-notes \
              --title "${RELEASE_TAG}"
          fi
          gh release upload "${RELEASE_TAG}" \
            codex-rate-proxy-x86_64-linux-musl.tar.gz \
            codex-rate-proxy-x86_64-linux-musl.tar.gz.sha256 \
            --clobber
