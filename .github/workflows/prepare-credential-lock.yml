name: Prepare credential encryption lockfile
on:
  pull_request:
    paths: [.github/workflows/prepare-credential-lock.yml]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo add chacha20poly1305@=0.10.1 --no-default-features --features alloc
      - uses: actions/upload-artifact@v4
        with:
          name: credential-lockfile
          path: Cargo.lock
